<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONTIME 팩토리 · 관리자</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5F7F9; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: Pretendard, 'Noto Sans KR', system-ui, sans-serif;
    font-size: 14px; color: #5E6B7A; background: #F5F7F9;
  }
</style>
</head>
<body>

<div id="loading">불러오는 중…</div>

<!--
  아래 src의 주소만 본인 웹앱 주소로 바꾸면 됩니다.
  - 직원용:   https://script.google.com/macros/s/<배포ID>/exec
  - 관리자용:  https://script.google.com/macros/s/<배포ID>/exec?p=admin
    (관리자용은 이 파일을 복사해 admin/index.html 로 따로 만드세요)
-->
<iframe
  id="app"
  src="https://script.google.com/macros/s/PASTE_YOUR_DEPLOYMENT_ID_HERE/exec?p=admin"
  allow="clipboard-write"
  onload="document.getElementById('loading').style.display='none'"
></iframe>

</body>
</html>
